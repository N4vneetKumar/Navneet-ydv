version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recycleme-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: recycleme
      POSTGRES_PASSWORD: recycleme123
      POSTGRES_DB: recycleme
    ports:
      - '5432:5432'
    volumes:
      - recycleme_pgdata:/var/lib/postgresql/data

volumes:
  recycleme_pgdata:
